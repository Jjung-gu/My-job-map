<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내일의 지도 - 커리어 로드맵 & 거점별 채용 공고 아카이브</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    
    .region-group { cursor: pointer; }

    .map-shape {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      stroke: #0f172a;
      stroke-width: 2.2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .map-label-main {
      font-size: 13px;
      font-weight: 800;
      fill: #0f172a;
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      transition: fill 0.2s ease;
    }
    .map-label-sub {
      font-size: 10px;
      font-weight: 600;
      fill: #334155;
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      transition: fill 0.2s ease;
    }

    .region-group:hover .map-shape {
      fill: #94a3b8 !important;
      stroke: #000000 !important;
      stroke-width: 3.2;
      filter: drop-shadow(0 4px 8px rgba(15, 23, 42, 0.25));
    }

    .region-group.active .map-shape {
      fill: #3b82f6 !important;
      stroke: #1e3a8a !important;
      stroke-width: 3.5;
      filter: drop-shadow(0 6px 12px rgba(37, 99, 235, 0.35));
    }
    .region-group.active .map-label-main,
    .region-group.active .map-label-sub {
      fill: #ffffff !important;
    }

    .region-badge {
      pointer-events: none;
      user-select: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .badge-circle {
      fill: #ef4444;
      stroke: #ffffff;
      stroke-width: 1.5;
      filter: drop-shadow(0 2px 4px rgba(239, 68, 68, 0.4));
    }
    .badge-text {
      font-size: 11px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen" onclick="closeCompanyPopupOutside(event)">

  <!-- 상단 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i class="fa-solid fa-map-location-dot text-lg"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-lg font-bold text-slate-900 tracking-tight">내일의 지도</h1>
            <span class="text-xs bg-indigo-100 text-indigo-700 font-semibold px-2 py-0.5 rounded-full">Archive Edition</span>
            <span id="sync-status-badge" class="text-[11px] bg-emerald-50 text-emerald-600 border border-emerald-200 font-medium px-2 py-0.5 rounded-full flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> D1 클라우드 동기화
            </span>
          </div>
          <p class="text-xs text-slate-500">수도권 거점별 기업 DB & 역대 채용 아카이브</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="exportData()" class="px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center space-x-1 transition">
          <i class="fa-solid fa-download"></i>
          <span class="hidden sm:inline">백업 저장</span>
        </button>
        <label class="px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center space-x-1 cursor-pointer transition">
          <i class="fa-solid fa-upload"></i>
          <span class="hidden sm:inline">불러오기</span>
          <input type="file" id="importFileInput" onchange="importData(event)" class="hidden" accept=".json">
        </label>
        <button onclick="openModal()" class="px-3.5 py-1.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm flex items-center space-x-1.5 transition">
          <i class="fa-solid fa-plus"></i>
          <span>공고 등록</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- 현황 통계 -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">누적 아카이브 기업</p>
          <p id="stat-companies" class="text-2xl font-bold text-slate-900 mt-1">0</p>
        </div>
        <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
          <i class="fa-solid fa-building"></i>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">현재 채용 진행 중</p>
          <p id="stat-active-jobs" class="text-2xl font-bold text-blue-600 mt-1">0</p>
        </div>
        <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
          <i class="fa-solid fa-fire"></i>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">지원 완료 / 전형 중</p>
          <p id="stat-applied" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
        </div>
        <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">
          <i class="fa-solid fa-paper-plane"></i>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">마감 보존 공고</p>
          <p id="stat-archived" class="text-2xl font-bold text-slate-600 mt-1">0</p>
        </div>
        <div class="w-10 h-10 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center">
          <i class="fa-solid fa-box-archive"></i>
        </div>
      </div>
    </section>

    <!-- 인터랙티브 지도 섹션 -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden p-5">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100">
        <div>
          <h2 class="text-base font-bold text-slate-900 flex items-center space-x-2">
            <span>거점별 채용 맵</span>
            <span id="current-filter-badge" class="text-xs bg-slate-100 text-slate-700 font-medium px-2.5 py-0.5 rounded-full">전체 구역</span>
          </h2>
          <p class="text-xs text-slate-500 mt-0.5">구역을 클릭하면 해당 권역에 역대 공고를 올린 기업 리스트와 현재 채용 공고가 표시됩니다.</p>
        </div>

        <div class="flex items-center bg-slate-100 p-1 rounded-xl text-xs font-semibold">
          <button id="view-tab-capital" onclick="switchMapView('capital')" class="px-3 py-1.5 rounded-lg bg-white text-blue-600 shadow-xs transition">수도권 거점 상세</button>
          <button id="view-tab-national" onclick="switchMapView('national')" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">전국 광역권</button>
        </div>
      </div>

      <!-- 지도 캔버스 영역 -->
      <div class="relative w-full h-[400px] sm:h-[480px] bg-[#f8fafc] rounded-xl my-4 overflow-hidden border border-slate-200 flex items-center justify-center">

        <!-- 1. 수도권 거점 상세 지도 SVG -->
        <svg id="svg-capital-view" viewBox="0 0 840 560" class="w-full h-full select-none">
          <!-- 북부 및 외곽 백지도 레이어 (비활성) -->
          <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.5">
            <path d="M 120,80 L 160,50 L 220,90 L 290,30 L 370,120 L 320,150 L 180,180 Z" />
            <path d="M 290,30 L 380,20 L 460,70 L 440,110 L 370,120 Z" />
            <text x="200" y="80" font-size="14" font-weight="800" fill="#0f172a">고양</text>
            <text x="430" y="75" font-size="14" font-weight="800" fill="#0f172a">파주</text>

            <path d="M 20,290 C 40,295 50,330 35,360 C 20,380 40,420 50,450 L 110,480 L 125,430 L 70,390 Z" />
            <path d="M 140,440 L 210,490 L 220,535 L 290,520 L 285,465 L 205,435 Z" />
            <text x="225" y="490" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">화성시(남양)</text>

            <path d="M 680,470 L 780,480 L 760,545 L 670,540 Z" />
            <text x="730" y="525" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">평택</text>
          </g>

          <!-- 한강 줄기 -->
          <path d="M 120,210 C 200,225 240,220 280,185 C 320,150 380,140 440,180 C 480,210 520,230 580,210 C 640,190 710,130 790,145" 
                fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

          <!-- 10대 인터랙티브 구역 및 숫자 배지 -->
          <!-- 1. 인천광역시 -->
          <g class="region-group" id="grp-incheon" onclick="filterByRegion('인천광역시')">
            <path class="map-shape" fill="#cbd5e1"
                  d="M 10,270 C 40,250 80,235 110,210 C 135,215 170,240 180,275 C 195,300 170,360 145,390 C 110,380 90,340 70,325 C 45,320 20,335 10,310 Z" />
            <text x="105" y="295" class="map-label-main">인천광역시</text>
            <g class="region-badge" id="badge-incheon" transform="translate(145, 275)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- 2. 서울 서남부권 -->
          <g class="region-group" id="grp-seoul-sw1" onclick="filterByRegion('서울 서남부권')">
            <path class="map-shape" fill="#cbd5e1"
                  d="M 280,185 C 310,160 355,160 380,175 C 390,195 440,200 450,225 C 405,245 360,240 330,225 C 295,220 280,200 280,185 Z" />
            <text x="360" y="195" class="map-label-main">서울 서남부권</text>
            <text x="360" y="210" class="map-label-sub">(강서·양천·영등포·동작)</text>
            <g class="region-badge" id="badge-seoul-sw1" transform="translate(415, 180)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- 3. 서울 남부권 -->
          <g class="region-group" id="grp-seoul-sw2" onclick="filterByRegion('서울 남부권')">
            <path class="map-shape" fill="#cbd5e1"
                  d="M 325,230 C 360,245 405,248 450,228 C 470,250 495,280 500,315 C 450,335 410,325 365,305 C 330,295 320,260 325,230 Z" />
            <text x="415" y="275" class="map-label-main">서울 남부권</text>
            <text x="415" y="290" class="map-label-sub">(구로·금천·관악)</text>
            <g class="region-badge" id="badge-seoul-sw2" transform="translate(470, 260)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- 4. 서울 강북권 -->
          <g class="region-group" id="grp-seoul-gb" onclick="filterByRegion('서울 강북권')">
            <path class="map-shape" fill="#cbd5e1"
                  d="M 370,125 C 430,70 500,45 570,40 C 630,35 690,65 700,110 C 705,150 660,180 620,195 C 570,215 500,185 450,175 C 395,145 375,135 370,125 Z" />
            <text x="545" y="115" class="map-label-main">강북권</text>
            <text x="545" y="132" class="map-label-sub">(마포·용산·중구·성동·종로·동대문·광진 등)</text>
            <g class="region-badge" id="badge-seoul-gb" transform="translate(590, 100)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- 5. 서울 강남권 -->
          <g class="region-group" id="grp-seoul-gn" onclick="filterByRegion('서울 강남권')">
            <path class="map-shape" fill="#cbd5e1"
                  d="M 455,225 C 505,185 575,210 620,195 C 655,220 670,265 650,305 C 595,330 550,325 505,310 C 490,270 470,245 455,225 Z" />
            <text x="565" y="255" class="map-label-main">서울 강남권</text>
            <text x="565" y="270" class="map-label-sub">(서초·강남·송파)</text>
            <g class="region-badge" id="badge-seoul-gn" transform="translate(620, 240)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- 6. 경기 남부 1구역 -->
          <g class="region-group" id="grp-gyeonggi-s1" onclick="filterByRegion('경기 남부 1구역')">
            <path class="map-shape" fill="#cbd5e1"
                  d="M 180,275 C 220,235 270,210 325,230 C 320,260 330,290 310,315 C 290,345 260,375 220,380 C 185,385 160,340 180,275 Z" />
            <text x="245" y="295" class="map-label-main">경기 남부 1구역</text>
            <text x="245" y="310" class="map-label-sub">(부천·시흥·광명)</text>
            <g class="region-badge" id="badge-gyeonggi-s1" transform="translate(295, 280)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- 7. 경기 남부 2구역 -->
          <g class="region-group" id="grp-gyeonggi-s2" onclick="filterByRegion('경기 남부 2구역')">
            <path class="map-shape" fill="#cbd5e1"
                  d="M 320,315 C 365,305 415,325 440,325 C 470,360 480,400 470,430 C 410,435 370,410 335,420 C 315,385 305,345 320,315 Z" />
            <text x="405" y="365" class="map-label-main">경기 남부 2구역</text>
            <text x="405" y="380" class="map-label-sub">(안양·과천·군포·의왕)</text>
            <g class="region-badge" id="badge-gyeonggi-s2" transform="translate(460, 350)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- 8. 경기 남부 3구역 -->
          <g class="region-group" id="grp-gyeonggi-s3" onclick="filterByRegion('경기 남부 3구역')">
            <path class="map-shape" fill="#cbd5e1"
                  d="M 625,195 C 675,215 725,245 745,305 C 720,375 700,435 670,465 C 595,470 550,440 515,415 C 485,385 490,340 510,315 C 555,325 600,325 650,305 C 665,260 650,225 625,195 Z" />
            <text x="615" y="380" class="map-label-main">경기 남부 3구역</text>
            <text x="615" y="395" class="map-label-sub">(성남·용인·하남)</text>
            <g class="region-badge" id="badge-gyeonggi-s3" transform="translate(680, 365)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- 9. 수원시 -->
          <g class="region-group" id="grp-suwon" onclick="filterByRegion('수원시')">
            <path class="map-shape" fill="#cbd5e1"
                  d="M 335,420 C 380,410 425,435 470,430 C 490,440 510,480 500,535 C 430,550 375,540 345,510 C 330,475 330,445 335,420 Z" />
            <text x="415" y="485" class="map-label-main" style="font-size: 15px;">수원시</text>
            <g class="region-badge" id="badge-suwon" transform="translate(450, 470)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- 10. 화성시(동탄) -->
          <g class="region-group" id="grp-dongtan" onclick="filterByRegion('화성시(동탄)')">
            <path class="map-shape" fill="#cbd5e1"
                  d="M 520,468 
                     C 530,462 590,460 615,466 
                     C 628,470 630,490 626,515 
                     C 622,538 610,548 590,548 
                     C 560,548 532,544 518,536 
                     C 508,528 510,480 520,468 Z" />
            <text x="568" y="503" class="map-label-main">동탄</text>
            <text x="568" y="518" class="map-label-sub">(화성시)</text>
            <g class="region-badge" id="badge-dongtan" transform="translate(605, 480)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <g transform="translate(770, 30)">
            <polygon points="15,0 24,30 15,24 6,30" fill="#000000" />
            <text x="15" y="44" font-size="13" font-weight="900" fill="#000000" text-anchor="middle">N</text>
          </g>
        </svg>

        <!-- 2. 전국 광역권 뷰 SVG -->
        <svg id="svg-national-view" viewBox="0 0 960 520" class="w-full h-full select-none hidden">
          <g class="region-group" id="grp-nat-수도권" onclick="filterByRegion('수도권 전체')">
            <path class="map-shape" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"
                  d="M 260 70 C 380 50 440 80 430 185 C 390 220 280 230 230 190 C 210 130 230 90 260 70 Z" />
            <text x="325" y="145" class="map-label-main" style="font-size: 15px;">수도권 (서울/경기/인천)</text>
            <g class="region-badge" id="badge-nat-수도권" transform="translate(415, 130)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="11" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <g class="region-group" id="grp-nat-강원권" onclick="filterByRegion('강원권')">
            <path class="map-shape" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"
                  d="M 445 60 C 600 40 660 70 640 180 C 580 200 480 195 440 170 C 425 120 430 80 445 60 Z" />
            <text x="535" y="125" class="map-label-main">강원권 (원주/춘천)</text>
            <g class="region-badge" id="badge-nat-강원권" transform="translate(605, 115)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <g class="region-group" id="grp-nat-대전충청" onclick="filterByRegion('대전/충청권')">
            <path class="map-shape" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"
                  d="M 255 210 C 420 195 470 220 460 310 C 410 340 310 345 235 315 C 220 260 235 225 255 210 Z" />
            <text x="345" y="270" class="map-label-main" style="font-size: 15px;">대전·충청 (오송/대덕)</text>
            <g class="region-badge" id="badge-nat-대전충청" transform="translate(425, 255)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <g class="region-group" id="grp-nat-경상권" onclick="filterByRegion('경상권')">
            <path class="map-shape" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"
                  d="M 475 210 C 660 190 730 250 690 440 C 580 480 480 440 450 370 C 445 290 460 240 475 210 Z" />
            <text x="575" y="325" class="map-label-main">경상권 (대구/부산/포항)</text>
            <g class="region-badge" id="badge-nat-경상권" transform="translate(650, 310)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <g class="region-group" id="grp-nat-전라권" onclick="filterByRegion('전라권')">
            <path class="map-shape" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"
                  d="M 230 325 C 380 320 430 340 420 460 C 370 495 260 500 200 465 C 195 400 210 350 230 325 Z" />
            <text x="315" y="410" class="map-label-main">전라권 (광주/전주/나주)</text>
            <g class="region-badge" id="badge-nat-전라권" transform="translate(390, 395)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="10" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>
        </svg>

        <button id="reset-filter-btn" onclick="filterByRegion(null)" class="hidden absolute top-3 right-3 bg-white/95 backdrop-blur-xs px-3 py-1.5 text-xs font-semibold text-slate-700 hover:text-blue-600 rounded-lg shadow-sm border border-slate-200 transition">
          <i class="fa-solid fa-arrow-rotate-left mr-1"></i> 전체 구역 보기
        </button>
      </div>

      <!-- 하단 권역 빠른 선택 칩 -->
      <div class="flex items-center space-x-1.5 overflow-x-auto pb-1 text-xs scrollbar-none" id="quick-region-chips"></div>
    </section>

    <!-- 선택 권역 역대 공고 등록 기업 아카이브 바 -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-xs p-5 space-y-3 relative">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-2 h-4 bg-indigo-600 rounded-full"></div>
          <h3 class="text-sm font-bold text-slate-900">
            <span id="archive-region-title">선택 권역</span> 역대 채용 등록 기업 풀 (Company Pool)
          </h3>
          <span id="archive-company-count" class="text-xs bg-indigo-50 text-indigo-700 font-bold px-2 py-0.5 rounded-full">0개사</span>
        </div>
        <span class="text-[11px] text-slate-400">1회 클릭 시 상태 태그 팝업 | 2회 클릭 시 전체 공고 복귀</span>
      </div>

      <div id="company-pool-container" class="flex flex-wrap gap-2 pt-1 relative"></div>
    </section>

    <!-- 공고 목록 섹션 -->
    <section class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
        <div class="flex items-center space-x-3">
          <div class="flex items-center bg-slate-100 p-1 rounded-lg text-xs font-semibold">
            <button id="tab-active-only" onclick="setArchiveTab('active')" class="px-3 py-1.5 rounded-md bg-white text-blue-600 shadow-xs transition">
              <i class="fa-solid fa-bolt mr-1 text-amber-500"></i> 현재 채용 중인 공고 (마감임박순)
            </button>
            <button id="tab-all-archive" onclick="setArchiveTab('all')" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition">
              <i class="fa-solid fa-box-archive mr-1"></i> 역대 전체 아카이브 (마감 포함)
            </button>
          </div>
          <span id="list-count" class="text-xs bg-blue-100 text-blue-700 font-bold px-2.5 py-1 rounded-full">0건</span>
        </div>

        <div class="flex items-center space-x-2">
          <input type="text" id="searchInput" oninput="renderPostings()" placeholder="회사명, 직무 검색..." class="px-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-48">
          <select id="statusFilter" onchange="renderPostings()" class="px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none">
            <option value="ALL">전체 전형 상태</option>
            <option value="관심">관심 공고</option>
            <option value="서류작성중">서류 작성 중</option>
            <option value="지원완료">지원 완료</option>
            <option value="1차면접">면접 전형</option>
            <option value="최종합격">최종 합격</option>
          </select>
        </div>
      </div>

      <div id="posting-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>
  </main>

  <!-- 새 공고 등록 모달 -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-100 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-base font-bold text-slate-900">새 채용 공고 등록</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="jobForm" onsubmit="saveJobPosting(event)" class="mt-4 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">회사명 *</label>
          <input type="text" id="form-company" required oninput="checkCompanyHistory()" placeholder="예: 한미약품, 유한양행, 에이비엘바이오" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <div id="history-detect-banner" class="hidden mt-1.5 p-2.5 bg-indigo-50 border border-indigo-100 rounded-lg text-xs text-indigo-700 flex items-start space-x-1.5">
            <i class="fa-solid fa-circle-info mt-0.5 text-indigo-500"></i>
            <span id="history-detect-text"></span>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">채용 포지션 / 공고 제목 *</label>
          <input type="text" id="form-title" required placeholder="예: In vitro 효능 평가 신약개발 연구원" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">근무 권역 *</label>
            <select id="form-region" required onchange="handleManualRegionChange()" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
              <optgroup label="수원 & 경기 남부 권역">
                <option value="수원시">수원시</option>
                <option value="화성시(동탄)">화성시(동탄)</option>
                <option value="경기 남부 3구역">경기 남부 3구역 (성남·용인·하남)</option>
                <option value="경기 남부 2구역">경기 남부 2구역 (안양·과천·군포·의왕)</option>
                <option value="경기 남부 1구역">경기 남부 1구역 (부천·시흥·광명)</option>
                <option value="인천광역시">인천광역시</option>
              </optgroup>
              <optgroup label="서울 권역 (4개)">
                <option value="서울 강남권">서울 강남권 (서초·강남·송파)</option>
                <option value="서울 서남부권">서울 서남부권 (강서·양천·영등포·동작)</option>
                <option value="서울 남부권">서울 남부권 (구로·금천·관악)</option>
                <option value="서울 강북권">서울 강북권 (마포·용산·종로·중구·성동 등)</option>
              </optgroup>
              <optgroup label="기타 전국 광역권">
                <option value="수도권 전체">수도권 기타/전체</option>
                <option value="대전/충청권">대전/충청권 (오송/대덕)</option>
                <option value="경상권">경상권 (대구/부산/포항 등)</option>
                <option value="전라권">전라권</option>
                <option value="강원권">강원권</option>
              </optgroup>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">마감일 *</label>
            <input type="date" id="form-deadline" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">공고 링크 (URL)</label>
          <input type="url" id="form-url" placeholder="https://..." class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">현재 상태</label>
            <select id="form-status" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="관심">관심 공고</option>
              <option value="서류작성중">서류 작성 중</option>
              <option value="지원완료">지원 완료</option>
              <option value="1차면접">1차 면접 예정</option>
              <option value="최종합격">최종 합격</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">지원 제출일 (로그)</label>
            <input type="date" id="form-applied-date" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">메모 (제출 서류 버전, 특이사항, 세부 근무지 주소)</label>
          <textarea id="form-memo" rows="2" placeholder="예: 판교 바이오센터 연구동, 포트폴리오 ver2.1 첨부" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        </div>

        <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">취소</button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let jobs = [];
    let selectedRegion = null;
    let selectedCompany = null;
    let currentMapView = 'capital';
    let currentArchiveTab = 'active';

    // 기업별 상태 태그 ('check' | 'cross' | 'square' | null)
    let companyTags = {};
    try {
      const savedTags = localStorage.getItem('my_company_tags');
      if (savedTags) companyTags = JSON.parse(savedTags);
    } catch(e) { companyTags = {}; }

    // 현재 열려 있는 팝업 대상 회사명
    let activePopupCompany = null;

    const CAPITAL_DETAILED_REGIONS = [
      '서울 강남권', '서울 서남부권', '서울 남부권', '서울 강북권',
      '수원시', '화성시(동탄)', '경기 남부 1구역', '경기 남부 2구역', '경기 남부 3구역', '인천광역시', '수도권 전체'
    ];

    function isCapitalRegion(regionName) {
      return CAPITAL_DETAILED_REGIONS.includes(regionName);
    }

    function normalizeRegion(name) {
      if (!name) return '';
      if (name === '서울 서남 1구역') return '서울 서남부권';
      if (name === '서울 서남 2구역') return '서울 남부권';
      return name;
    }

    function matchesRegionFilter(jobRegion, targetFilter) {
      if (!targetFilter) return true;
      const normalizedJob = normalizeRegion(jobRegion);
      const normalizedTarget = normalizeRegion(targetFilter);

      if (normalizedTarget === '수도권 전체') {
        return isCapitalRegion(normalizedJob);
      }
      return normalizedJob === normalizedTarget;
    }

    // Cloudflare D1 서버 API에서 공고 목록 호출
    async function loadJobsFromServer() {
      try {
        const res = await fetch('/api/jobs');
        if (res.ok) {
          jobs = await res.json();
          localStorage.setItem('my_jobs_data', JSON.stringify(jobs));
          updateSyncBadge(true);
        } else {
          fallbackLocal();
          updateSyncBadge(false);
        }
      } catch (e) {
        fallbackLocal();
        updateSyncBadge(false);
      }
      refreshUI();
    }

    function fallbackLocal() {
      const stored = localStorage.getItem('my_jobs_data');
      if (stored) {
        try { jobs = JSON.parse(stored); } catch(e) { jobs = []; }
      }
    }

    function updateSyncBadge(isOnline) {
      const badge = document.getElementById('sync-status-badge');
      if (!badge) return;
      if (isOnline) {
        badge.className = "text-[11px] bg-emerald-50 text-emerald-600 border border-emerald-200 font-medium px-2 py-0.5 rounded-full flex items-center gap-1";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> D1 클라우드 동기화`;
      } else {
        badge.className = "text-[11px] bg-amber-50 text-amber-700 border border-amber-200 font-medium px-2 py-0.5 rounded-full flex items-center gap-1";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> 오프라인 모드`;
      }
    }

    function refreshUI() {
      updateStats();
      renderRegionChips();
      renderCompanyPool();
      renderPostings();
      updateMapBadges();
      highlightActiveMapRegions();
    }

    function isExpired(deadlineStr) {
      if (!deadlineStr) return false;
      const today = new Date();
      today.setHours(0,0,0,0);
      const target = new Date(deadlineStr);
      target.setHours(0,0,0,0);
      return (target - today) < 0;
    }

    function updateStats() {
      const uniqueCompanies = new Set(jobs.map(j => j.company.trim().toLowerCase())).size;
      const activeJobs = jobs.filter(j => !isExpired(j.deadline)).length;
      const appliedJobs = jobs.filter(j => j.status === '지원완료' || j.status === '1차면접' || j.status === '최종합격').length;
      const archivedJobs = jobs.filter(j => isExpired(j.deadline)).length;

      document.getElementById('stat-companies').innerText = uniqueCompanies;
      document.getElementById('stat-active-jobs').innerText = activeJobs;
      document.getElementById('stat-applied').innerText = appliedJobs;
      document.getElementById('stat-archived').innerText = archivedJobs;
    }

    function updateMapBadges() {
      const badgeMapping = {
        '인천광역시': 'badge-incheon',
        '서울 강북권': 'badge-seoul-gb',
        '서울 서남부권': 'badge-seoul-sw1',
        '서울 남부권': 'badge-seoul-sw2',
        '서울 강남권': 'badge-seoul-gn',
        '경기 남부 1구역': 'badge-gyeonggi-s1',
        '경기 남부 2구역': 'badge-gyeonggi-s2',
        '경기 남부 3구역': 'badge-gyeonggi-s3',
        '수원시': 'badge-suwon',
        '화성시(동탄)': 'badge-dongtan',
        '강원권': 'badge-nat-강원권',
        '대전/충청권': 'badge-nat-대전충청',
        '경상권': 'badge-nat-경상권',
        '전라권': 'badge-nat-전라권'
      };

      const activeCounts = {};
      let totalCapitalActiveCount = 0;

      jobs.filter(j => !isExpired(j.deadline)).forEach(j => {
        const reg = normalizeRegion(j.region);
        activeCounts[reg] = (activeCounts[reg] || 0) + 1;
        if (isCapitalRegion(reg)) {
          totalCapitalActiveCount++;
        }
      });

      Object.entries(badgeMapping).forEach(([regName, badgeId]) => {
        const badgeEl = document.getElementById(badgeId);
        if (!badgeEl) return;

        const count = activeCounts[regName] || 0;
        if (count > 0) {
          badgeEl.style.display = 'inline';
          const textEl = badgeEl.querySelector('.badge-text');
          if (textEl) textEl.textContent = count > 99 ? '99+' : count;
        } else {
          badgeEl.style.display = 'none';
        }
      });

      const natCapitalBadge = document.getElementById('badge-nat-수도권');
      if (natCapitalBadge) {
        if (totalCapitalActiveCount > 0) {
          natCapitalBadge.style.display = 'inline';
          const textEl = natCapitalBadge.querySelector('.badge-text');
          if (textEl) textEl.textContent = totalCapitalActiveCount > 99 ? '99+' : totalCapitalActiveCount;
        } else {
          natCapitalBadge.style.display = 'none';
        }
      }
    }

    function setArchiveTab(tab) {
      currentArchiveTab = tab;
      const tabActive = document.getElementById('tab-active-only');
      const tabAll = document.getElementById('tab-all-archive');

      if (tab === 'active') {
        tabActive.className = "px-3 py-1.5 rounded-md bg-white text-blue-600 shadow-xs transition";
        tabAll.className = "px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition";
      } else {
        tabAll.className = "px-3 py-1.5 rounded-md bg-white text-blue-600 shadow-xs transition";
        tabActive.className = "px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition";
      }
      renderPostings();
    }

    function switchMapView(view) {
      currentMapView = view;
      const capitalSvg = document.getElementById('svg-capital-view');
      const nationalSvg = document.getElementById('svg-national-view');
      const tabCap = document.getElementById('view-tab-capital');
      const tabNat = document.getElementById('view-tab-national');

      if (view === 'capital') {
        capitalSvg.classList.remove('hidden');
        nationalSvg.classList.add('hidden');
        tabCap.className = "px-3 py-1.5 rounded-lg bg-white text-blue-600 shadow-xs transition";
        tabNat.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
      } else {
        capitalSvg.classList.add('hidden');
        nationalSvg.classList.remove('hidden');
        tabNat.className = "px-3 py-1.5 rounded-lg bg-white text-blue-600 shadow-xs transition";
        tabCap.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
      }
      highlightActiveMapRegions();
    }

    function filterByRegion(region) {
      selectedRegion = normalizeRegion(region);
      selectedCompany = null;
      activePopupCompany = null;
      const badge = document.getElementById('current-filter-badge');
      const resetBtn = document.getElementById('reset-filter-btn');

      if (selectedRegion) {
        const count = jobs.filter(j => matchesRegionFilter(j.region, selectedRegion)).length;
        badge.innerText = `${selectedRegion} (${count}건 아카이브)`;
        badge.className = "text-xs bg-blue-100 text-blue-700 font-bold px-2.5 py-0.5 rounded-full";
        resetBtn.classList.remove('hidden');
      } else {
        badge.innerText = "전체 구역";
        badge.className = "text-xs bg-slate-100 text-slate-700 font-medium px-2.5 py-0.5 rounded-full";
        resetBtn.classList.add('hidden');
      }

      highlightActiveMapRegions();
      renderRegionChips();
      renderCompanyPool();
      renderPostings();
    }

    // 기업 클릭 핸들러 (1회 클릭 시 팝업 & 필터, 2회 클릭 시 전체 복귀)
    function handleCompanyClick(event, comp) {
      event.stopPropagation();

      if (selectedCompany === comp) {
        // 2회 클릭 시: 전체 공고로 복귀
        selectedCompany = null;
        activePopupCompany = null;
      } else {
        // 1회 클릭 시: 해당 기업 필터링 적용 및 팝업 토글
        selectedCompany = comp;
        activePopupCompany = comp;
      }

      renderCompanyPool();
      renderPostings();
    }

    function closeCompanyPopupOutside(event) {
      if (activePopupCompany && !event.target.closest('#company-pool-container')) {
        activePopupCompany = null;
        renderCompanyPool();
      }
    }

    // 기업 상태 태그 설정 ('check' | 'cross' | 'square' | null)
    function setCompanyTag(event, comp, tagType) {
      event.stopPropagation();
      if (companyTags[comp] === tagType || tagType === null) {
        delete companyTags[comp];
      } else {
        companyTags[comp] = tagType;
      }
      localStorage.setItem('my_company_tags', JSON.stringify(companyTags));
      renderCompanyPool();

    // 기업 풀에서 기업 완전 삭제 (연계된 공고 D1 일괄 삭제)
    async function deleteCompanyFromPool(event, comp) {
      event.stopPropagation();
      const targetJobs = jobs.filter(j => j.company.trim().toLowerCase() === comp.toLowerCase());
      const msg = `'${comp}' 기업을 기업 풀에서 삭제하시겠습니까?\n등록된 관련 공고 ${targetJobs.length}건이 함께 완전히 삭제됩니다.`;
      
      if (!confirm(msg)) return;

      // 1. D1 클라우드 서버에서 해당 기업의 공고들 삭제
      for (const j of targetJobs) {
        try {
          await fetch(`/api/jobs?id=${j.id}`, { method: 'DELETE' });
        } catch(e) {}
      }

      // 2. 로컬 메모리 및 태그 삭제
      jobs = jobs.filter(j => j.company.trim().toLowerCase() !== comp.toLowerCase());
      delete companyTags[comp];
      localStorage.setItem('my_company_tags', JSON.stringify(companyTags));
      localStorage.setItem('my_jobs_data', JSON.stringify(jobs));

      if (selectedCompany === comp) selectedCompany = null;
      activePopupCompany = null;

      refreshUI();
      alert(`'${comp}' 기업 및 등록 공고가 성공적으로 삭제되었습니다.`);
    }

    function getDDay(deadlineStr) {
      if (!deadlineStr) return { text: "마감 미정", color: "bg-slate-100 text-slate-600", diff: 999, isExpired: false, isUrgent: false };
      const today = new Date();
      today.setHours(0,0,0,0);
      const target = new Date(deadlineStr);
      target.setHours(0,0,0,0);
      const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));

      if (diff < 0) return { text: "마감 아카이브", color: "bg-slate-100 text-slate-500 border border-slate-200", diff, isExpired: true, isUrgent: false };
      if (diff === 0) return { text: "D-Day (오늘)", color: "bg-red-500 text-white font-bold animate-pulse", diff, isExpired: false, isUrgent: true };
      if (diff <= 3) return { text: `D-${diff} 임박`, color: "bg-red-100 text-red-700 font-bold", diff, isExpired: false, isUrgent: true };
      if (diff <= 7) return { text: `D-${diff}`, color: "bg-amber-100 text-amber-800 font-semibold", diff, isExpired: false, isUrgent: true };
      return { text: `D-${diff}`, color: "bg-blue-50 text-blue-700 font-medium", diff, isExpired: false, isUrgent: false };
    }

        case '최종합격': return '<span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-600 text-white">최종 합격</span>';
        default: return `<span class="px-2 py-0.5 rounded text-[11px] bg-slate-100 text-slate-700">${status}</span>`;

    }

    // 서버 D1 DB로 신규 공고 저장 (POST)
    async function saveJobPosting(e) {
      e.preventDefault();
      const company = document.getElementById('form-company').value.trim();
      const title = document.getElementById('form-title').value.trim();
      const region = normalizeRegion(document.getElementById('form-region').value);
      const deadline = document.getElementById('form-deadline').value;
      const url = document.getElementById('form-url').value.trim();
      const status = document.getElementById('form-status').value;
      const appliedDate = document.getElementById('form-applied-date').value;
      const memo = document.getElementById('form-memo').value.trim();

      const existing = jobs.find(j => j.company.toLowerCase() === company.toLowerCase());
      let historyList = [];

      if (existing) {
        historyList = [
          ...(existing.history || []),
          {
            date: existing.deadline || "과거 공고",
            title: existing.title,
            status: existing.status,
            note: existing.memo || "과거 공고 연계"
          }
        ];
      }

      const newJob = {
        id: "job-" + Date.now(),
        company,
        title,
        region,
        deadline,
        url,
        status,
        appliedDate,
        memo,
        history: historyList
      };

      try {
        const res = await fetch('/api/jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newJob)
        });
        if (res.ok) {
          jobs.unshift(newJob);
        } else {
          jobs.unshift(newJob);
        }
      } catch (err) {
        jobs.unshift(newJob);
      }

      localStorage.setItem('my_jobs_data', JSON.stringify(jobs));
      refreshUI();
      closeModal();
    }

    // 서버 D1 DB에서 단일 공고 삭제 (DELETE)
    async function deleteJob(id) {
      if (confirm('이 공고를 클라우드 DB에서 완전히 삭제하시겠습니까?')) {
        try {
          await fetch(`/api/jobs?id=${id}`, { method: 'DELETE' });
        } catch (e) {}

        jobs = jobs.filter(j => j.id !== id);
        localStorage.setItem('my_jobs_data', JSON.stringify(jobs));
        refreshUI();
      }
    }

    function exportData() {
      const exportPayload = {
        jobs,
        companyTags
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportPayload, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `내일의지도_아카이브데이터_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // 백업 JSON을 불러올 때 서버 D1으로 일괄 전송
    async function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          let importList = [];
          
          if (Array.isArray(imported)) {
            importList = imported;
          } else if (imported.jobs && Array.isArray(imported.jobs)) {
            importList = imported.jobs;
            if (imported.companyTags) {
              companyTags = { ...companyTags, ...imported.companyTags };
              localStorage.setItem('my_company_tags', JSON.stringify(companyTags));
            }
          }

          if (importList.length > 0) {
            for (const item of importList) {
              item.region = normalizeRegion(item.region);
              await fetch('/api/jobs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
              });
            }
            await loadJobsFromServer();
            alert('기존 백업 공고가 Cloudflare D1 클라우드로 안전하게 이전되었습니다!');
          }
        } catch(err) {
          alert('올바른 JSON 백업 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    }

    // 진입 시 서버 D1 데이터 로드
    loadJobsFromServer();
  </script>
</body>
</html>

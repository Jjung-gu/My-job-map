<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내일의 지도 - 커리어 로드맵 & 거점별 채용 공고 아카이브</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    
    .region-group { cursor: pointer; }

    /* 직소 퍼즐 피스 기본 스타일 */
    .puzzle-piece {
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      stroke: #334155;
      stroke-width: 2.2;
      stroke-linejoin: round;
      stroke-linecap: round;
      fill: #f1f5f9;
      filter: drop-shadow(0 2px 3px rgba(15, 23, 42, 0.06));
    }

    .map-label-main {
      font-size: 13.5px;
      font-weight: 800;
      fill: #0f172a;
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      transition: fill 0.2s ease;
    }
    .map-label-sub {
      font-size: 10.5px;
      font-weight: 600;
      fill: #64748b;
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
      transition: fill 0.2s ease;
    }

    /* 퍼즐 피스 호버 시 살짝 들려 올려지는 입체 효과 */
    .region-group:hover .puzzle-piece {
      fill: #cbd5e1 !important;
      stroke: #0284c7 !important;
      stroke-width: 3;
      transform: translateY(-3px);
      filter: drop-shadow(0 8px 14px rgba(2, 132, 199, 0.22));
    }

    /* 선택/활성화된 퍼즐 피스 */
    .region-group.active .puzzle-piece {
      fill: #2563eb !important;
      stroke: #1e3a8a !important;
      stroke-width: 3.2;
      transform: translateY(-2px);
      filter: drop-shadow(0 8px 18px rgba(37, 99, 235, 0.35));
    }
    .region-group.active .map-label-main,
    .region-group.active .map-label-sub {
      fill: #ffffff !important;
    }

    .region-badge {
      pointer-events: none;
      user-select: none;
    }
    .badge-circle {
      fill: #ef4444;
      stroke: #ffffff;
      stroke-width: 2;
      filter: drop-shadow(0 2px 4px rgba(239, 68, 68, 0.45));
    }
    .badge-text {
      font-size: 11px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .river-flow {
      stroke: url(#hanRiverGrad);
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 3px 6px rgba(14, 165, 233, 0.3));
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen" onclick="closeCompanyPopupOutside(event)">

  <!-- 상단 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i class="fa-solid fa-briefcase text-lg"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-lg font-bold text-slate-900 tracking-tight">내일의 지도</h1>
            <span class="text-xs bg-indigo-100 text-indigo-700 font-semibold px-2 py-0.5 rounded-full">GH Edition</span>
            <span id="sync-status-badge" class="text-[11px] bg-emerald-50 text-emerald-600 border border-emerald-200 font-medium px-2 py-0.5 rounded-full flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> D1 클라우드 동기화
            </span>
          </div>
          <p class="text-xs text-slate-500">수도권 거점별 기업 DB & 역대 채용 아카이브</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="exportData()" class="px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center space-x-1 transition">
          <i class="fa-solid fa-download"></i>
          <span class="hidden sm:inline">백업 저장</span>
        </button>
        <label class="px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center space-x-1 cursor-pointer transition">
          <i class="fa-solid fa-upload"></i>
          <span class="hidden sm:inline">불러오기</span>
          <input type="file" id="importFileInput" onchange="importData(event)" class="hidden" accept=".json">
        </label>
        <button onclick="openModal()" class="px-3.5 py-1.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm flex items-center space-x-1.5 transition">
          <i class="fa-solid fa-plus"></i>
          <span>공고 등록</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- 현황 통계 -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">누적 아카이브 기업</p>
          <p id="stat-companies" class="text-2xl font-bold text-slate-900 mt-1">0</p>
        </div>
        <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
          <i class="fa-solid fa-building"></i>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">현재 채용 진행 중</p>
          <p id="stat-active-jobs" class="text-2xl font-bold text-blue-600 mt-1">0</p>
        </div>
        <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
          <i class="fa-solid fa-fire"></i>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">지원 완료 / 전형 중</p>
          <p id="stat-applied" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
        </div>
        <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">
          <i class="fa-solid fa-paper-plane"></i>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">마감 보존 공고</p>
          <p id="stat-archived" class="text-2xl font-bold text-slate-600 mt-1">0</p>
        </div>
        <div class="w-10 h-10 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center">
          <i class="fa-solid fa-box-archive"></i>
        </div>
      </div>
    </section>

    <!-- 인터랙티브 직소 퍼즐 지도 섹션 -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden p-5">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100">
        <div>
          <h2 class="text-base font-bold text-slate-900 flex items-center space-x-2">
            <span>수도권 거점 직소 퍼즐 맵</span>
            <span id="current-filter-badge" class="text-xs bg-slate-100 text-slate-700 font-medium px-2.5 py-0.5 rounded-full">전체 구역</span>
          </h2>
          <p class="text-xs text-slate-500 mt-0.5">퍼즐 조각을 클릭하면 해당 권역 기업과 공고가 필터링되며, 다시 클릭하면 전체 구역으로 돌아옵니다.</p>
        </div>

        <div class="flex items-center bg-slate-100 p-1 rounded-xl text-xs font-semibold">
          <button id="view-tab-capital" onclick="switchMapView('capital')" class="px-3 py-1.5 rounded-lg bg-white text-blue-600 shadow-xs transition">수도권 퍼즐 뷰</button>
          <button id="view-tab-national" onclick="switchMapView('national')" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">전국 광역권</button>
        </div>
      </div>

      <!-- 지도 캔버스 영역 -->

        <!-- [뷰 1] 수도권 모서리 둥근 사각 그리드형 직소 퍼즐 SVG -->
        <svg id="svg-capital-view" viewBox="-30 -20 1000 620" class="w-full h-full select-none">
          <defs>
            <linearGradient id="hanRiverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="50%" stop-color="#0284c7" />
              <stop offset="100%" stop-color="#0369a1" />
            </linearGradient>
          </defs>

          <!-- 파란색 한강 물줄기 -->
          <path class="river-flow"
                d="M 140,175 C 240,142 320,142 440,165 C 560,188 650,175 860,128" 
                fill="none" stroke-width="18" />
          <path d="M 145,175 C 242,142 320,142 440,165 C 560,188 650,175 855,128" 
                fill="none" stroke="#bae6fd" stroke-width="3.5" opacity="0.85" />

          <!-- [1] 서울 강북권 -->
          <g class="region-group" id="grp-seoul-gb" onclick="filterByRegion('서울 강북권')">
            <path class="puzzle-piece"
                  d="M 334,25 L 646,25 Q 670,25 670,49 L 670,130 Q 670,152 646,154 C 570,164 510,160 440,147 C 385,137 355,134 334,134 Q 310,134 310,110 L 310,49 Q 310,25 334,25 Z" />

            <g class="region-badge" id="badge-seoul-gb" transform="translate(615, 65)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="11" />

          <!-- [2] 인천광역시 -->
          <g class="region-group" id="grp-incheon" onclick="filterByRegion('인천광역시')">

          <!-- [3] 서울 서남부권 -->

          <g class="region-group" id="grp-seoul-sw2" onclick="filterByRegion('서울 남부권')">

            <path class="puzzle-piece"
                  d="M 580,192 C 640,185 705,172 765,158 L 765,225 C 765,233 789,225 789,240 C 789,255 765,247 765,255 L 765,310 L 687,310 C 679,310 687,334 672,334 C 657,334 665,310 657,310 L 580,310 L 580,255 C 580,247 604,255 604,240 C 604,225 580,233 580,225 L 580,192 Z" />
            <text x="672" y="238" class="map-label-main">서울 강남권</text>
            <text x="672" y="255" class="map-label-sub">(서초·강남·송파)</text>
            <g class="region-badge" id="badge-seoul-gn" transform="translate(738, 215)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="11" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- [6] 경기 남부 1구역 -->
          <g class="region-group" id="grp-gyeonggi-s1" onclick="filterByRegion('경기 남부 1구역')">
            <path class="puzzle-piece"
                  d="M 210,310 L 287,310 C 295,310 287,334 302,334 C 317,334 309,310 317,310 L 395,310 L 395,360 C 395,368 419,360 419,375 C 419,390 395,382 395,390 L 395,440 L 234,440 Q 210,440 210,416 L 210,395 C 210,387 186,395 186,380 C 186,365 210,373 210,365 L 210,310 Z" />

            <text x="302" y="392" class="map-label-sub">(부천·시흥·광명)</text>
            <g class="region-badge" id="badge-gyeonggi-s1" transform="translate(368, 355)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="11" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- [7] 경기 남부 2구역 -->
          <g class="region-group" id="grp-gyeonggi-s2" onclick="filterByRegion('경기 남부 2구역')">
            <path class="puzzle-piece"
                  d="M 395,310 L 472,310 C 480,310 472,286 487,286 C 502,286 494,310 502,310 L 580,310 L 580,360 C 580,368 604,360 604,375 C 604,390 580,382 580,390 L 580,440 L 502,440 C 494,440 502,464 487,464 C 472,464 480,440 472,440 L 395,440 L 395,390 C 395,382 419,390 419,375 C 419,360 395,368 395,360 L 395,310 Z" />
            <text x="487" y="375" class="map-label-main">경기 남부 2구역</text>

            <path class="puzzle-piece"
                  d="M 580,310 L 657,310 C 665,310 657,334 672,334 C 687,334 679,310 687,310 L 765,310 L 765,255 C 765,247 789,255 789,240 C 789,225 765,233 765,225 L 765,158 C 805,149 840,142 868,138 Q 895,134 895,162 L 895,416 Q 895,440 871,440 L 780,440 C 772,440 780,416 765,416 C 750,416 758,440 750,440 L 580,440 L 580,390 C 580,382 604,390 604,375 C 604,360 580,368 580,360 L 580,310 Z" />
            <text x="735" y="375" class="map-label-main">경기 남부 3구역</text>
            <text x="735" y="392" class="map-label-sub">(성남·용인·하남)</text>

            </g>
          </g>

          <!-- [9] 수원시 -->
          <g class="region-group" id="grp-suwon" onclick="filterByRegion('수원시')">
            <path class="puzzle-piece"
                  d="M 395,440 L 472,440 C 480,440 472,464 487,464 C 502,464 494,440 502,440 L 580,440 L 580,490 C 580,498 604,490 604,505 C 604,520 580,512 580,520 L 580,565 L 419,565 Q 395,565 395,541 L 395,440 Z" />
            <text x="487" y="512" class="map-label-main" style="font-size: 15px;">수원시</text>

          <!-- [10] 화성시(동탄) -->
          <g class="region-group" id="grp-dongtan" onclick="filterByRegion('화성시(동탄)')">
            <path class="puzzle-piece"
                  d="M 580,440 L 750,440 C 758,440 750,416 765,416 C 780,416 772,440 780,440 L 800,440 L 800,541 Q 800,565 776,565 L 580,565 L 580,520 C 580,512 604,520 604,505 C 604,490 580,498 580,490 L 580,440 Z" />
            <text x="692" y="502" class="map-label-main">동탄</text>
            <text x="692" y="519" class="map-label-sub">(화성시)</text>
            <g class="region-badge" id="badge-dongtan" transform="translate(755, 488)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="11" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- 방위 표시 -->
          <g transform="translate(885, 20)">
            <circle cx="15" cy="15" r="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
            <polygon points="15,5 19,19 15,16 11,19" fill="#0284c7" />
            <text x="15" y="38" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">N</text>
          </g>
        </svg>

        <!-- [뷰 2] 전국 광역권 라운드 사각 그리드 직소 퍼즐 SVG -->
        <svg id="svg-national-view" viewBox="0 0 960 540" class="w-full h-full select-none hidden">
          
          <!-- [1] 수도권 (서울/경기/인천) - 좌측 상단 퍼즐 블록 -->
          <g class="region-group" id="grp-nat-수도권" onclick="filterByRegion('수도권 전체')">
            <path class="puzzle-piece"
                  d="M 168,35 L 480,35 L 480,95 C 480,104 506,95 506,112 C 506,129 480,120 480,129 L 480,190 L 327,190 C 318,190 327,216 310,216 C 293,216 302,190 293,190 L 140,190 L 140,63 Q 140,35 168,35 Z" />

            <g class="region-badge" id="badge-nat-수도권" transform="translate(420, 80)" style="display: none;">
              <circle class="badge-circle" cx="0" cy="0" r="12" />
              <text class="badge-text" x="0" y="0">0</text>
            </g>
          </g>

          <!-- [2] 강원권 (원주/춘천) - 우측 상단 퍼즐 블록 -->

  <script>
    let jobs = [];
    let selectedRegion = null;
    let selectedCompany = null;
    let currentMapView = 'capital';
    let currentArchiveTab = 'active';

    let companyTags = {};
    try {
      const savedTags = localStorage.getItem('my_company_tags');
      if (savedTags) companyTags = JSON.parse(savedTags);
    } catch(e) { companyTags = {}; }

    let activePopupCompany = null;

    const CAPITAL_DETAILED_REGIONS = [
      '서울 강남권', '서울 서남부권', '서울 남부권', '서울 강북권',
      '수원시', '화성시(동탄)', '경기 남부 1구역', '경기 남부 2구역', '경기 남부 3구역', '인천광역시', '수도권 전체'
    ];

    function isCapitalRegion(regionName) {
      return CAPITAL_DETAILED_REGIONS.includes(regionName);
    }

    function normalizeRegion(name) {
      if (!name) return '';
      if (name === '서울 서남 1구역') return '서울 서남부권';
      if (name === '서울 서남 2구역') return '서울 남부권';
      return name;
    }

    function matchesRegionFilter(jobRegion, targetFilter) {
      if (!targetFilter) return true;
      const normalizedJob = normalizeRegion(jobRegion);
      const normalizedTarget = normalizeRegion(targetFilter);

      if (normalizedTarget === '수도권 전체') {
        return isCapitalRegion(normalizedJob);
      }
      return normalizedJob === normalizedTarget;
    }

    async function loadJobsFromServer() {
      fallbackLocal();
      refreshUI();

      try {
        const res = await fetch('/api/jobs');
        if (res.ok) {
          const serverData = await res.json();
          if (Array.isArray(serverData)) {
            if (serverData.length > 0) {
              jobs = serverData;
              localStorage.setItem('my_jobs_data', JSON.stringify(jobs));
            }
            updateSyncBadge(true);
          } else {
            updateSyncBadge(false);
          }
        } else {
          updateSyncBadge(false);
        }
      } catch (e) {
        updateSyncBadge(false);
      }
      refreshUI();
    }

    function fallbackLocal() {
      const stored = localStorage.getItem('my_jobs_data');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            jobs = parsed;
          }
        } catch(e) {}
      }
    }

    function updateSyncBadge(isOnline) {
      const badge = document.getElementById('sync-status-badge');
      if (!badge) return;
      if (isOnline) {
        badge.className = "text-[11px] bg-emerald-50 text-emerald-600 border border-emerald-200 font-medium px-2 py-0.5 rounded-full flex items-center gap-1";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> D1 클라우드 동기화`;
      } else {
        badge.className = "text-[11px] bg-amber-50 text-amber-700 border border-amber-200 font-medium px-2 py-0.5 rounded-full flex items-center gap-1";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> 오프라인 모드`;
      }
    }

    function refreshUI() {
      updateStats();
      renderRegionChips();
      renderCompanyPool();
      renderPostings();
      updateMapBadges();
      highlightActiveMapRegions();
    }

    function isAlwaysOpen(deadlineStr) {
      return deadlineStr === '채용시마감' || deadlineStr === '상시채용' || !deadlineStr;
    }

    function isExpired(deadlineStr) {
      if (isAlwaysOpen(deadlineStr)) return false;
      const today = new Date();
      today.setHours(0,0,0,0);
      const target = new Date(deadlineStr);
      target.setHours(0,0,0,0);
      return (target - today) < 0;
    }

    function updateStats() {
      const uniqueCompanies = new Set(jobs.map(j => j.company.trim().toLowerCase())).size;
      const activeJobs = jobs.filter(j => !isExpired(j.deadline)).length;
      const appliedJobs = jobs.filter(j => j.status === '지원완료' || j.status === '1차면접' || j.status === '최종합격').length;
      const archivedJobs = jobs.filter(j => isExpired(j.deadline)).length;

      document.getElementById('stat-companies').innerText = uniqueCompanies;
      document.getElementById('stat-active-jobs').innerText = activeJobs;
      document.getElementById('stat-applied').innerText = appliedJobs;
      document.getElementById('stat-archived').innerText = archivedJobs;
    }

    function updateMapBadges() {
      const badgeMapping = {
        '인천광역시': 'badge-incheon',
        '서울 강북권': 'badge-seoul-gb',
        '서울 서남부권': 'badge-seoul-sw1',
        '서울 남부권': 'badge-seoul-sw2',
        '서울 강남권': 'badge-seoul-gn',
        '경기 남부 1구역': 'badge-gyeonggi-s1',
        '경기 남부 2구역': 'badge-gyeonggi-s2',
        '경기 남부 3구역': 'badge-gyeonggi-s3',
        '수원시': 'badge-suwon',
        '화성시(동탄)': 'badge-dongtan',
        '강원권': 'badge-nat-강원권',
        '대전/충청권': 'badge-nat-대전충청',
        '경상권': 'badge-nat-경상권',
        '전라권': 'badge-nat-전라권'
      };

      const activeCounts = {};
      let totalCapitalActiveCount = 0;

      jobs.filter(j => !isExpired(j.deadline)).forEach(j => {
        const reg = normalizeRegion(j.region);
        activeCounts[reg] = (activeCounts[reg] || 0) + 1;
        if (isCapitalRegion(reg)) {
          totalCapitalActiveCount++;
        }
      });

      Object.entries(badgeMapping).forEach(([regName, badgeId]) => {
        const badgeEl = document.getElementById(badgeId);
        if (!badgeEl) return;

        const count = activeCounts[regName] || 0;
        if (count > 0) {
          badgeEl.style.display = 'inline';
          const textEl = badgeEl.querySelector('.badge-text');
          if (textEl) textEl.textContent = count > 99 ? '99+' : count;
        } else {
          badgeEl.style.display = 'none';
        }
      });

      const natCapitalBadge = document.getElementById('badge-nat-수도권');
      if (natCapitalBadge) {
        if (totalCapitalActiveCount > 0) {
          natCapitalBadge.style.display = 'inline';
          const textEl = natCapitalBadge.querySelector('.badge-text');
          if (textEl) textEl.textContent = totalCapitalActiveCount > 99 ? '99+' : totalCapitalActiveCount;
        } else {
          natCapitalBadge.style.display = 'none';
        }
      }

    function setArchiveTab(tab) {
      currentArchiveTab = tab;

      if (tab === 'active') {
        tabActive.className = "px-3 py-1.5 rounded-md bg-white text-blue-600 shadow-xs transition";

        tabActive.className = "px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition";

    function switchMapView(view) {
      currentMapView = view;
      const capitalSvg = document.getElementById('svg-capital-view');
      const nationalSvg = document.getElementById('svg-national-view');
      const tabCap = document.getElementById('view-tab-capital');
      const tabNat = document.getElementById('view-tab-national');

    function filterByRegion(region) {
      const target = normalizeRegion(region);

      if (!target || selectedRegion === target) {
        selectedRegion = null;
      } else {
        selectedRegion = target;
      }

      selectedCompany = null;
      activePopupCompany = null;
      const badge = document.getElementById('current-filter-badge');
      const resetBtn = document.getElementById('reset-filter-btn');

      if (selectedRegion) {
        const count = jobs.filter(j => matchesRegionFilter(j.region, selectedRegion)).length;
        badge.innerText = `${selectedRegion} (${count}건 아카이브)`;
        badge.className = "text-xs bg-blue-100 text-blue-700 font-bold px-2.5 py-0.5 rounded-full";
        resetBtn.classList.remove('hidden');
      } else {
        badge.innerText = "전체 구역";
        badge.className = "text-xs bg-slate-100 text-slate-700 font-medium px-2.5 py-0.5 rounded-full";
        resetBtn.classList.add('hidden');
      }

      highlightActiveMapRegions();
      renderRegionChips();
      renderCompanyPool();
      renderPostings();
    }

    function handleCompanyClick(event, comp) {
      event.stopPropagation();

      if (selectedCompany === comp) {
        selectedCompany = null;
        activePopupCompany = null;
        filterByRegion(null);
      } else {
        const matchedJob = jobs.find(j => j.company.trim().toLowerCase() === comp.toLowerCase());
        if (matchedJob && matchedJob.region) {
          const compRegion = normalizeRegion(matchedJob.region);
          if (selectedRegion !== compRegion) {
            selectedRegion = compRegion;
            const badge = document.getElementById('current-filter-badge');
            const resetBtn = document.getElementById('reset-filter-btn');
            const count = jobs.filter(j => matchesRegionFilter(j.region, compRegion)).length;
            badge.innerText = `${compRegion} (${count}건 아카이브)`;
            badge.className = "text-xs bg-blue-100 text-blue-700 font-bold px-2.5 py-0.5 rounded-full";
            resetBtn.classList.remove('hidden');
            highlightActiveMapRegions();
            renderRegionChips();
          }
        }

        selectedCompany = comp;
        activePopupCompany = comp;
        renderCompanyPool();
        renderPostings();
      }
    }

    function closeCompanyPopupOutside(event) {
      if (activePopupCompany && !event.target.closest('#company-pool-container')) {
        activePopupCompany = null;
        renderCompanyPool();
      }
    }

    function setCompanyTag(event, comp, tagType) {
      event.stopPropagation();
      if (companyTags[comp] === tagType || tagType === null) {
        delete companyTags[comp];
      } else {
        companyTags[comp] = tagType;
      }
      localStorage.setItem('my_company_tags', JSON.stringify(companyTags));
      renderCompanyPool();
    }

    async function deleteCompanyFromPool(event, comp) {
      event.stopPropagation();
      const targetJobs = jobs.filter(j => j.company.trim().toLowerCase() === comp.toLowerCase());
      const msg = `'${comp}' 기업을 기업 풀에서 삭제하시겠습니까?\n등록된 관련 공고 ${targetJobs.length}건이 함께 완전히 삭제됩니다.`;
      
      if (!confirm(msg)) return;

      for (const j of targetJobs) {
        try {
          await fetch(`/api/jobs?id=${j.id}`, { method: 'DELETE' });
        } catch(e) {}
      }

      jobs = jobs.filter(j => j.company.trim().toLowerCase() !== comp.toLowerCase());
      delete companyTags[comp];
      localStorage.setItem('my_company_tags', JSON.stringify(companyTags));
      localStorage.setItem('my_jobs_data', JSON.stringify(jobs));

      if (selectedCompany === comp) selectedCompany = null;
      activePopupCompany = null;

      refreshUI();
      alert(`'${comp}' 기업 및 등록 공고가 성공적으로 삭제되었습니다.`);
    }

    function getDDay(deadlineStr) {
      if (isAlwaysOpen(deadlineStr)) {
        return { 
          text: "D-∞", 
          color: "bg-orange-100/80 text-orange-800 font-bold border border-orange-300", 
          diff: -999999,
          isExpired: false, 
          isUrgent: false,
          isAlways: true
        };
      }

      const today = new Date();
      today.setHours(0,0,0,0);
      const target = new Date(deadlineStr);
      target.setHours(0,0,0,0);
      const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));

      if (diff < 0) return { text: "마감 아카이브", color: "bg-slate-200 text-slate-800 font-bold border border-slate-300", diff, isExpired: true, isUrgent: false, isAlways: false };
      if (diff === 0) return { text: "D-Day (오늘)", color: "bg-red-500 text-white font-bold animate-pulse", diff, isExpired: false, isUrgent: true, isAlways: false };
      if (diff <= 3) return { text: `D-${diff} 임박`, color: "bg-rose-100 text-rose-800 font-bold border border-rose-300", diff, isExpired: false, isUrgent: true, isAlways: false };
      if (diff <= 7) return { text: `D-${diff}`, color: "bg-amber-100 text-amber-800 font-semibold border border-amber-300", diff, isExpired: false, isUrgent: true, isAlways: false };
      return { text: `D-${diff}`, color: "bg-blue-50 text-blue-700 font-medium border border-blue-200", diff, isExpired: false, isUrgent: false, isAlways: false };
    }

        case '서류작성중': return '<span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200">서류 작성 중</span>';
        case '지원완료': return '<span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">지원 완료</span>';
        case '1차면접': return '<span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-purple-50 text-purple-700 border border-purple-200">1차 면접 예정</span>';
        case '최종합격': return '<span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-600 text-white">최종 합격</span>';
        default: return `<span class="px-2 py-0.5 rounded text-[11px] bg-slate-100 text-slate-700">${status}</span>`;
      }
    }

    function renderPostings() {
      const listContainer = document.getElementById('posting-list');
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;

      let filtered = jobs.filter(item => {
        const matchesRegion = matchesRegionFilter(item.region, selectedRegion);
        const matchesCompany = !selectedCompany || item.company.trim().toLowerCase() === selectedCompany.toLowerCase();
        const matchesSearch = !search || item.company.toLowerCase().includes(search) || item.title.toLowerCase().includes(search);
        const matchesStatus = statusFilter === 'ALL' || item.status === statusFilter;
        
        const expired = isExpired(item.deadline);
        const matchesTab = currentArchiveTab === 'all' || !expired;

        return matchesRegion && matchesCompany && matchesSearch && matchesStatus && matchesTab;
      });

      if (currentArchiveTab === 'active') {
        filtered.sort((a, b) => {
          const ddayA = getDDay(a.deadline);
          const ddayB = getDDay(b.deadline);

          if (ddayA.isAlways && !ddayB.isAlways) return -1;
          if (!ddayA.isAlways && ddayB.isAlways) return 1;

          return ddayA.diff - ddayB.diff;
        });
      } else {
        filtered.sort((a, b) => {
          const compA = (a.company || '').trim();
          const compB = (b.company || '').trim();
          const compCompare = compA.localeCompare(compB, 'ko', { sensitivity: 'base' });
          
          if (compCompare !== 0) return compCompare;
          return (b.id || '').localeCompare(a.id || '');
        });
      }

      document.getElementById('list-count').innerText = `${filtered.length}건`;

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="col-span-full py-12 text-center bg-white rounded-2xl border border-dashed border-slate-200">
            <i class="fa-regular fa-folder-open text-3xl text-slate-300 mb-2"></i>
            <p class="text-xs text-slate-500">
              ${currentArchiveTab === 'active' ? '현재 채용 진행 중인 공고가 없습니다. (역대 전체 아카이브 탭을 눌러 과거 공고를 확인하세요)' : '조건에 맞는 공고 아카이브가 없습니다.'}
            </p>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = filtered.map(job => {
        const dday = getDDay(job.deadline);
        const hasHistory = job.history && job.history.length > 0;
        const displayRegion = normalizeRegion(job.region);
        const tag = companyTags[job.company.trim()] || null;

        let borderClass = "border border-slate-200 bg-white";
        if (dday.isExpired) {
          borderClass = "border-2 border-slate-900 bg-slate-50/70 shadow-xs";
        } else if (dday.isAlways) {
          borderClass = "border-2 border-orange-400/80 bg-orange-50/50 shadow-xs";
        } else if (dday.isUrgent) {
          borderClass = "border-2 border-rose-500 bg-rose-50/60 shadow-xs";
        }

        const deadlineText = dday.isAlways 
          ? '<span class="text-orange-700 font-bold">채용 시 마감 (상시)</span>' 
          : (dday.isExpired ? `<span class="text-slate-900 font-bold">${job.deadline}</span>` : job.deadline);

        return `
          <div class="rounded-xl ${borderClass} p-5 transition flex flex-col justify-between relative overflow-hidden">
            ${dday.isExpired ? `
              <div class="absolute -top-1 -right-1">
                <span class="bg-slate-900 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-bl-lg shadow-2xs flex items-center gap-1">
                  <i class="fa-solid fa-lock"></i> 마감됨
                </span>
              </div>
            ` : (dday.isAlways ? `
              <div class="absolute -top-1 -right-1">
                <span class="bg-orange-500 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-bl-lg shadow-2xs flex items-center gap-1">
                  <i class="fa-solid fa-infinity"></i> 상시 채용
                </span>
              </div>
            ` : (dday.isUrgent ? `
              <div class="absolute -top-1 -right-1">
                <span class="bg-rose-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-bl-lg shadow-2xs flex items-center gap-1">
                  <i class="fa-solid fa-triangle-exclamation"></i> 마감 임박
                </span>
              </div>
            ` : ''))}

            <div>
              <div class="flex items-start justify-between gap-2 mb-2 pr-6">
                <div>
                  <button onclick="handleCompanyClick(event, '${job.company}')" class="text-xs font-bold text-indigo-700 hover:underline uppercase tracking-wider text-left inline-flex items-center gap-1">
                    <i class="fa-regular fa-building"></i>
                    <span>${job.company}</span>
                    ${getTagBadgeHtml(tag)}
                  </button>
                  <h4 class="text-sm font-bold text-slate-900 mt-0.5 line-clamp-1">${job.title}</h4>
                </div>
                <span class="text-xs px-2.5 py-0.5 rounded-full ${dday.color} shrink-0">${dday.text}</span>
              </div>

              <div class="flex items-center space-x-2 text-xs text-slate-600 mb-3">
                <span class="flex items-center space-x-1"><i class="fa-solid fa-location-dot text-slate-400"></i> <span>${displayRegion}</span></span>
                <span>•</span>
                <span>${dday.isExpired ? '공고 마감일' : '마감'}: <strong class="${dday.isAlways ? 'text-orange-700 font-bold' : (!dday.isExpired && dday.isUrgent ? 'text-rose-700 font-bold' : '')}">${deadlineText}</strong></span>
              </div>

              <div class="flex items-center justify-between p-2.5 bg-white/80 rounded-lg text-xs mb-3 border border-slate-200/80 shadow-2xs">
                <div class="flex items-center space-x-2">
                  <span class="text-slate-500 font-medium">전형:</span>
                  ${getStatusBadge(job.status)}
                </div>
                ${job.appliedDate ? `<span class="text-[11px] text-slate-500 font-mono"><i class="fa-regular fa-calendar-check mr-1 text-emerald-600"></i>${job.appliedDate} 접수</span>` : ''}
              </div>

              ${job.memo ? `<p class="text-xs text-slate-600 bg-white/90 p-2 rounded-lg border border-slate-200/80 mb-3 shadow-2xs"><i class="fa-regular fa-note-sticky text-blue-500 mr-1"></i>${job.memo}</p>` : ''}

              ${hasHistory ? `
                <div class="mt-3 pt-3 border-t border-slate-200/70">
                  <div class="flex items-center justify-between text-xs font-bold text-indigo-700 mb-2">
                    <span class="flex items-center space-x-1">
                      <i class="fa-solid fa-clock-rotate-left"></i>
                      <span>동일 기업 이전 공고 이력 (${job.history.length}건)</span>
                    </span>
                  </div>
                  <div class="space-y-1.5">
                    ${job.history.map(hist => `
                      <div class="text-[11px] bg-white/80 p-2 rounded-md border border-slate-200/70 flex items-center justify-between">
                        <div>
                          <span class="font-bold text-slate-700">[${hist.date}]</span>
                          <span class="text-slate-600 ml-1">${hist.title}</span>
                          ${hist.note ? `<span class="block text-[10px] text-slate-500 mt-0.5">• ${hist.note}</span>` : ''}
                        </div>
                        <span class="text-[10px] font-semibold text-slate-600 bg-slate-50 px-1.5 py-0.5 rounded shadow-2xs">${hist.status}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>

            <div class="mt-4 pt-3 border-t border-slate-200/70 flex items-center justify-between text-xs">
              ${job.url ? `
                <a href="${job.url}" target="_blank" class="text-blue-600 hover:text-blue-800 font-semibold flex items-center space-x-1">
                  <span>공고 원문 보기</span>
                  <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                </a>
              ` : `<span></span>`}
              <div class="flex items-center space-x-1">
                <button onclick="editJob('${job.id}')" title="공고 수정" class="text-slate-400 hover:text-blue-600 transition p-1.5 rounded-lg hover:bg-white/80">
                  <i class="fa-regular fa-pen-to-square"></i>
                </button>
                <button onclick="deleteJob('${job.id}')" title="아카이브 삭제" class="text-slate-400 hover:text-red-500 transition p-1.5 rounded-lg hover:bg-white/80">
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleAlwaysOpen() {
      const checkbox = document.getElementById('form-always-open');
      const deadlineInput = document.getElementById('form-deadline');

      if (checkbox.checked) {
        deadlineInput.value = '';
        deadlineInput.disabled = true;
        deadlineInput.required = false;
        deadlineInput.classList.add('bg-slate-100', 'text-slate-400');
      } else {
        deadlineInput.disabled = false;
        deadlineInput.required = true;
        deadlineInput.classList.remove('bg-slate-100', 'text-slate-400');
      }
    }

    function openModal() {
      document.getElementById('jobForm').reset();
      document.getElementById('form-edit-id').value = '';
      document.getElementById('modal-title').innerText = '새 채용 공고 등록';
      document.getElementById('form-submit-btn').innerText = '저장하기';
      document.getElementById('form-close-job-btn').classList.add('hidden');
      document.getElementById('form-always-open').checked = false;
      toggleAlwaysOpen();
      document.getElementById('history-detect-banner').classList.add('hidden');
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function editJob(id) {
      const job = jobs.find(j => j.id === id);
      if (!job) return;

      document.getElementById('jobForm').reset();
      document.getElementById('form-edit-id').value = job.id;
      document.getElementById('modal-title').innerText = '채용 공고 수정';
      document.getElementById('form-submit-btn').innerText = '수정 내용 반영';
      document.getElementById('form-close-job-btn').classList.remove('hidden');
      document.getElementById('history-detect-banner').classList.add('hidden');

      document.getElementById('form-company').value = job.company;
      document.getElementById('form-title').value = job.title;
      document.getElementById('form-region').value = normalizeRegion(job.region);
      document.getElementById('form-url').value = job.url || '';
      document.getElementById('form-status').value = job.status || '관심';
      document.getElementById('form-applied-date').value = job.appliedDate || '';
      document.getElementById('form-memo').value = job.memo || '';

      const alwaysCheckbox = document.getElementById('form-always-open');
      const deadlineInput = document.getElementById('form-deadline');

      if (isAlwaysOpen(job.deadline)) {
        alwaysCheckbox.checked = true;
        toggleAlwaysOpen();
      } else {
        alwaysCheckbox.checked = false;
        toggleAlwaysOpen();
        deadlineInput.value = job.deadline;
      }

      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    async function archiveCurrentJobFromModal() {
      const editId = document.getElementById('form-edit-id').value.trim();
      if (!editId) return;

      const jobIndex = jobs.findIndex(j => j.id === editId);
      if (jobIndex === -1) return;

      const job = jobs[jobIndex];
      const todayStr = new Date().toISOString().slice(0, 10);

      if (!confirm(`'${job.company} - ${job.title}' 공고를 마감 처리하시겠습니까?\n마감일이 오늘(${todayStr})로 기록되며, 검정 테두리와 함께 '역대 전체 아카이브' 탭으로 안전하게 보존·이동됩니다.`)) {
        return;
      }

      const updatedJob = {
        ...job,
        deadline: todayStr
      };

      try {
        await fetch(`/api/jobs?id=${editId}`, { method: 'DELETE' });
        await fetch('/api/jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedJob)
        });
      } catch (e) {}

      jobs[jobIndex] = updatedJob;
      localStorage.setItem('my_jobs_data', JSON.stringify(jobs));

      refreshUI();
      closeModal();
      alert('공고가 마감 처리되어 역대 아카이브로 안전하게 이동되었습니다.');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function checkCompanyHistory() {
      if (document.getElementById('form-edit-id').value) return;

      const companyVal = document.getElementById('form-company').value.trim();
      const banner = document.getElementById('history-detect-banner');
      const bannerText = document.getElementById('history-detect-text');
      const regionSelect = document.getElementById('form-region');

      if (!companyVal) {
        banner.classList.add('hidden');
        return;
      }

      const match = jobs.find(j => j.company.toLowerCase() === companyVal.toLowerCase());
      
      if (match) {
        const normRegion = normalizeRegion(match.region);
        regionSelect.value = normRegion;
        bannerText.innerHTML = `
          <span>'<strong>${match.company}</strong>' 등록 이력이 있습니다. 이전 권역(<strong>${normRegion}</strong>)이 자동 선택되었습니다. 사업장이 다를 경우 아래 드롭다운에서 직접 변경하실 수 있습니다.</span>
        `;
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }
    }

    function handleManualRegionChange() {
      const banner = document.getElementById('history-detect-banner');
      const bannerText = document.getElementById('history-detect-text');
      const regionSelect = document.getElementById('form-region');

      if (!banner.classList.contains('hidden')) {
        bannerText.innerHTML = `<span>근무 권역을 '<strong>${regionSelect.value}</strong>'으로 직접 변경하셨습니다.</span>`;
      }
    }

    async function saveJobPosting(e) {
      e.preventDefault();
      const editId = document.getElementById('form-edit-id').value.trim();
      const company = document.getElementById('form-company').value.trim();
      const title = document.getElementById('form-title').value.trim();
      const region = normalizeRegion(document.getElementById('form-region').value);
      const isAlways = document.getElementById('form-always-open').checked;
      const deadline = isAlways ? '채용시마감' : document.getElementById('form-deadline').value;
      const url = document.getElementById('form-url').value.trim();
      const status = document.getElementById('form-status').value;
      const appliedDate = document.getElementById('form-applied-date').value;
      const memo = document.getElementById('form-memo').value.trim();

      if (editId) {
        const oldIndex = jobs.findIndex(j => j.id === editId);
        const oldJob = oldIndex !== -1 ? jobs[oldIndex] : {};
        const updatedJob = {
          ...oldJob,
          id: editId,
          company,
          title,
          region,
          deadline,
          url,
          status,
          appliedDate,
          memo
        };

        try {
          await fetch(`/api/jobs?id=${editId}`, { method: 'DELETE' });
          await fetch('/api/jobs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedJob)
          });
        } catch(err) {}

        if (oldIndex !== -1) jobs[oldIndex] = updatedJob;
      } else {
        const existing = jobs.find(j => j.company.toLowerCase() === company.toLowerCase());
        let historyList = [];

        if (existing) {
          historyList = [
            ...(existing.history || []),
            {
              date: existing.deadline || "과거 공고",
              title: existing.title,
              status: existing.status,
              note: existing.memo || "과거 공고 연계"
            }
          ];
        }

        const newJob = {
          id: "job-" + Date.now(),
          company,
          title,
          region,
          deadline,
          url,
          status,
          appliedDate,
          memo,
          history: historyList
        };

        try {
          await fetch('/api/jobs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newJob)
          });
        } catch (err) {}

        jobs.unshift(newJob);
      }

      localStorage.setItem('my_jobs_data', JSON.stringify(jobs));
      refreshUI();
      closeModal();
    }

    async function deleteJob(id) {
      if (confirm('이 공고를 클라우드 DB에서 완전히 삭제하시겠습니까?\n(아카이브에 남기지 않고 영구 삭제됩니다)')) {
        try {
          await fetch(`/api/jobs?id=${id}`, { method: 'DELETE' });
        } catch (e) {}

        jobs = jobs.filter(j => j.id !== id);
        localStorage.setItem('my_jobs_data', JSON.stringify(jobs));
        refreshUI();
      }
    }

    function exportData() {
      const exportPayload = {
        jobs,
        companyTags
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportPayload, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `내일의지도_아카이브데이터_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    async function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          let importList = [];
          
          if (Array.isArray(imported)) {
            importList = imported;
          } else if (imported.jobs && Array.isArray(imported.jobs)) {
            importList = imported.jobs;
            if (imported.companyTags) {
              companyTags = { ...companyTags, ...imported.companyTags };
              localStorage.setItem('my_company_tags', JSON.stringify(companyTags));
            }
          }

          if (importList.length > 0) {
            for (const item of importList) {
              item.region = normalizeRegion(item.region);
              await fetch('/api/jobs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
              });
            }
            await loadJobsFromServer();
            alert('기존 백업 공고가 Cloudflare D1 클라우드로 안전하게 이전되었습니다!');
          }
        } catch(err) {
          alert('올바른 JSON 백업 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    }

    loadJobsFromServer();
  </script>
</body>
